syntax = "proto3";

package product.v1;

option java_package = "com.assignment.protos.product.v1";
option java_multiple_files = true;
option java_outer_classname = "ProductServiceProto";

import "google/protobuf/timestamp.proto";

service ProductService {
  rpc CreateProduct(CreateProductRequest) returns (ProductResponse);
  rpc GetProduct(GetProductRequest) returns (ProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);

  // Sets stock to the exact requested quantity (not a delta).
  rpc UpdateStock(UpdateStockRequest) returns (ProductResponse);

  // Internal order-processing operations.
  rpc ReserveStock(ReserveStockRequest) returns (StockOperationResponse);
  rpc ReleaseStock(ReleaseStockRequest) returns (StockOperationResponse);
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  // Decimal representation, e.g. "19.99", to preserve BigDecimal precision.
  string price = 3;
  string currency = 4;
  int32 stock_quantity = 5;
}

message GetProductRequest {
  int64 product_id = 1;
}

message ListProductsRequest {}

message ListProductsResponse {
  repeated ProductResponse products = 1;
}

message UpdateStockRequest {
  int64 product_id = 1;
  // Sets the exact stock quantity.
  int32 stock_quantity = 2;
}

message ReserveStockRequest {
  int64 product_id = 1;
  int32 quantity = 2;
}

message ReleaseStockRequest {
  int64 product_id = 1;
  int32 quantity = 2;
}

message StockOperationResponse {
  int64 product_id = 1;
  int32 stock_quantity = 2;
}

message ProductResponse {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string price = 4;
  string currency = 5;
  int32 stock_quantity = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}
